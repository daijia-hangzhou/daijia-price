<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>代驾费用预估</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; }
    #result { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; display: none; }
    .price { font-size: 28px; color: #e4393c; font-weight: bold; }
    button { background: #ff6600; color: white; border: none; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>🚗 代驾费用预估</h2>
  <p>起点：<strong id="startText">正在定位...</strong></p>
  <input type="text" id="endInput" placeholder="请输入目的地（如：杭州东站）">
  <button onclick="calculate()">查看价格</button>
  <div id="result">
    <p>当前时段：<strong id="periodTag" style="color:#ff6600;"></strong></p>
    <p>预估距离：<span id="distance"></span> 公里</p>
    <p>预估费用：<span class="price" id="price"></span> 元</p>
    <p style="font-size:13px;color:#555;" id="ruleDetail"></p>
    <p style="font-size:12px;color:#999;">
      🕒 司机到达后免费等候10分钟，超出后1元/分钟<br>
      （具体费用以实际服务为准）
    </p>
  </div>

  <script>
    // ！！！重要：把下面这一对单引号里的文字换成你之前保存的 Key
    const GAODE_KEY = '085f7b2675d9a561c67365c42bb063ac';
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=085f7b2675d9a561c67365c42bb063ac&plugin=AMap.Geolocation,AMap.Driving,AMap.AutoComplete"></script>
  <script>
    let startLngLat = null;
    const startText = document.getElementById('startText');

    // 自动定位
    AMap.plugin('AMap.Geolocation', () => {
      const geolocation = new AMap.Geolocation({ enableHighAccuracy: true, timeout: 10000 });
      geolocation.getCurrentPosition((status, result) => {
        if (status === 'complete' && result.position) {
          startLngLat = [result.position.lng, result.position.lat];
          const geocoder = new AMap.Geocoder();
          geocoder.getAddress(startLngLat, (geoStatus, geoResult) => {
            startText.innerText = geoStatus === 'complete' ? geoResult.regeocode.formattedAddress : '定位成功（地址解析失败）';
          });
        } else {
          startText.innerText = '定位失败，请刷新重试或手动输入起点';
        }
      });
    });

    // 时段判断
    function getTimePeriod() {
      const hour = new Date().getHours();
      return (hour >= 22 || hour < 6) ? 'night' : 'day';
    }

    // 计费规则
    function calcPrice(km) {
      const period = getTimePeriod();
      const baseKm = 8;
      const config = {
        day:   { base: 35, perKm: 3.5, desc: '日间(06:00-21:59)' },
        night: { base: 50, perKm: 3.5, desc: '夜间(22:00-05:59)' }
      };
      const c = config[period];
      let price = km <= baseKm ? c.base : c.base + (km - baseKm) * c.perKm;
      return {
        price: Math.ceil(price),
        periodDesc: c.desc,
        baseInfo: `${c.base}元/${baseKm}公里`,
        extraInfo: `超出后${c.perKm}元/公里`
      };
    }

    function calculate() {
      const endAddr = document.getElementById('endInput').value.trim();
      if (!endAddr) return alert('请输入目的地');
      if (!startLngLat) return alert('尚未获得起点位置，请刷新后允许定位');

      const geocoder = new AMap.Geocoder();
      geocoder.getLocation(endAddr, (status, result) => {
        if (status === 'complete' && result.geocodes.length) {
          const endPos = result.geocodes[0].location;
          const driving = new AMap.Driving({ map: null });
          driving.search(startLngLat, endPos, (driveStatus, driveResult) => {
            if (driveStatus === 'complete' && driveResult.routes.length) {
              const distance = (driveResult.routes[0].distance / 1000).toFixed(1);
              const priceResult = calcPrice(distance);
              document.getElementById('distance').innerText = distance;
              document.getElementById('price').innerText = priceResult.price;
              document.getElementById('periodTag').innerText = priceResult.periodDesc;
              document.getElementById('ruleDetail').innerText = 
                `起步价：${priceResult.baseInfo}，${priceResult.extraInfo}`;
              document.getElementById('result').style.display = 'block';
            } else {
              alert('路线规划失败，请检查目的地');
            }
          });
        } else {
          alert('未找到目的地，请重新输入');
        }
      });
    }
  </script>
</body>
</html>
